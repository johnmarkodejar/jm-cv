name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            APP_DIR="/var/www/jm-cv"

            # Clone repo on first deploy, pull on subsequent ones
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone ${{ secrets.REPO_URL }} $APP_DIR
            fi

            cd $APP_DIR
            git pull origin main

            # Install dependencies and build
            npm ci
            npm run build

            # Start or restart with PM2
            if pm2 list | grep -q "jm-cv"; then
              pm2 restart jm-cv
            else
              pm2 start node --name "jm-cv" -- .next/standalone/server.js
              pm2 save
            fi
