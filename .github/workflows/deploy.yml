name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/johnmarkodejar/jm-cv:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="/var/www/jm-cv"

            # Clone repo on first deploy, pull on subsequent ones
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone ${{ secrets.REPO_URL }} $APP_DIR
            fi

            cd $APP_DIR
            git pull origin main

            # Image is built and pushed to GHCR by the build-and-push job,
            # off this box entirely — the box only ever pulls the finished
            # image, same pattern as the other services already on it.
            docker compose pull
            docker compose up -d
